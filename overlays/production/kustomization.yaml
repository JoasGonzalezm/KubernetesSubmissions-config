apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
  # The database is backed up only in production
resources:
- ../../base
- ../../apps/todo_backup
images:
- name: PROJECT/BROADCASTER
  newName: ghcr.io/joasgonzalezm/broadcaster
  newTag: "5.1"
- name: PROJECT/TODO_APP
  newName: ghcr.io/joasgonzalezm/todo-app
  newTag: "5.1"
- name: PROJECT/TODO_BACKEND
  newName: ghcr.io/joasgonzalezm/todo-backend
  newTag: "5.1"
- name: PROJECT/TODO_BACKUP
  newName: ghcr.io/joasgonzalezm/todo-backup
  newTag: "5.1"
- name: PROJECT/TODO_CRONJOB
  newName: ghcr.io/joasgonzalezm/todo-cronjob
  newTag: "5.1"
