apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-dep
spec:
  replicas: 1
  # The image cache PVC is ReadWriteOnce, so the old pod has to go before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: PROJECT/TODO_APP
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              path: /ready
              port: 3000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: "10m"
              memory: 48Mi
            limits:
              cpu: "200m"
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
